<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="인증이 완료된 상태를 표시하는 공개 페이지" />
    <title>인증 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="success-card">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" aria-label="성공 아이콘">
            <path d="M9.55 15.15 5.8 11.4l-1.4 1.4 5.15 5.15 10.85-10.85-1.4-1.4z"/>
          </svg>
        </div>

        <p class="eyebrow">Verification Status</p>
        <h1>인증이 완료되었습니다!</h1>
        <p class="subtext">
          안전하게 등록이 마무리되었으며,
          이제 서비스를 정상적으로 이용하실 수 있습니다.
        </p>

        <div class="actions">
          <a href="https://github.com/yeonhob51-tech/public-sheet-demo" class="primary-btn" target="_blank" rel="noreferrer">
            저장소 보기
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
